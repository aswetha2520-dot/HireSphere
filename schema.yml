    User:
      type: object
      description: Public representation of the User model.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Unique email address used for login.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
          description: |-
            User role defining access permissions.

            * `CANDIDATE` - Candidate
            * `EMPLOYER` - Employer
            * `ADMIN` - Admin
        is_active:
          type: boolean
          readOnly: true
          description: Designates whether this user should be treated as active.
        is_staff:
          type: boolean
          readOnly: true
          description: Designates whether the user can log into the Django admin site.
        is_superuser:
          type: boolean
          readOnly: true
          description: Designates whether the user has all permissions without explicitly
            assigning them.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - is_staff
      - is_superuser
      - role
    UserRegistrationRequest:
      type: object
      description: Serializer for registering a new Candidate or Employer.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          description: Unique email address used for login.
          maxLength: 255
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/UserRegistrationRoleEnum'
          default: CANDIDATE
          description: |-
            Account role: CANDIDATE or EMPLOYER. (ADMIN registration is restricted).

            * `CANDIDATE` - CANDIDATE
            * `EMPLOYER` - EMPLOYER
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: At least 8 characters long.
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
          description: Must match password exactly.
        company_name:
          type: string
          writeOnly: true
        full_name:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - password_confirm
    UserRegistrationRoleEnum:
      enum:
      - CANDIDATE
      - EMPLOYER
      type: string
      description: |-
        * `CANDIDATE` - CANDIDATE
        * `EMPLOYER` - EMPLOYER
    UserRoleEnum:
      enum:
      - CANDIDATE
      - EMPLOYER
      - ADMIN
      type: string
      description: |-
        * `CANDIDATE` - Candidate
        * `EMPLOYER` - Employer
        * `ADMIN` - Admin
